<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote — MGT Starfaces</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{
  --black:#0b0b0c; --panel:#141416; --panel2:#1b1b1e;
  --red:#8c0f0f; --red-bright:#c41414; --gold:#d4af37; --gold-soft:#b8933f;
  --white:#f5f3ef; --muted:#a39d97; --line:#2a2626;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Poppins',Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Oswald',sans-serif;font-weight:600;}
.container{max-width:1080px;margin:0 auto;padding:0 20px;}
header{padding:20px 0;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;justify-content:space-between;}
.brand .word{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;}
.brand a{color:var(--gold);font-size:14px;}
.hero{padding:40px 0 20px;text-align:center;}
.hero h1{font-size:clamp(26px,5vw,38px);margin-bottom:10px;}
.hero p{color:var(--muted);font-size:15px;}
.status-banner{margin:20px auto;max-width:600px;padding:14px 20px;border-radius:4px;text-align:center;font-size:14.5px;font-weight:500;}
.status-open{background:rgba(212,175,55,.12);border:1px solid var(--gold-soft);color:var(--gold);}
.status-closed{background:var(--panel);border:1px solid var(--line);color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;padding:30px 0 60px;}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:16px;}}
.sf{text-align:center;cursor:pointer;}
.sf.eliminated{cursor:default;}
.photo-wrap{position:relative;width:100%;aspect-ratio:1;margin-bottom:10px;}
.photo-circle{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--gold-soft);display:block;background:var(--panel2);}
.eliminated .photo-circle{filter:grayscale(1) brightness(.5);border-color:var(--line);}
.elim-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.elim-tag span{background:var(--red-bright);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:3px;transform:rotate(-14deg);}
.star-badge{position:absolute;bottom:-6px;right:6%;width:46px;height:46px;background:var(--gold);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  display:flex;align-items:center;justify-content:center;}
.star-badge span{font-size:10px;font-weight:700;color:var(--black);font-family:'Poppins',sans-serif;}
.sf-name{font-size:14px;font-weight:600;}
.sf-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:420px;width:100%;padding:28px;}
.modal h3{font-size:22px;margin-bottom:4px;}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:20px;}
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.pkg{border:1px solid var(--line);border-radius:4px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--panel2);}
.pkg.active{border-color:var(--gold);background:rgba(212,175,55,.1);}
.pkg .v{font-family:'Oswald',sans-serif;font-size:20px;color:var(--gold);}
.pkg .p{font-size:13px;color:var(--muted);margin-top:2px;}
.modal input[type=email]{width:100%;padding:12px 14px;border-radius:4px;border:1px solid var(--line);background:var(--black);color:var(--white);font-size:14px;margin-bottom:16px;}
.modal input::placeholder{color:var(--muted);}
.btn{display:block;width:100%;padding:14px;border-radius:4px;font-weight:600;font-size:15px;border:0;cursor:pointer;}
.btn-primary{background:var(--red-bright);color:#fff;}
.btn-primary:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;}
.btn-close{background:none;color:var(--muted);margin-top:10px;font-size:13px;text-align:center;cursor:pointer;border:0;width:100%;padding:8px;}
.msg{text-align:center;font-size:14px;margin-top:14px;min-height:18px;}
.msg.ok{color:#7fd97f;}
.msg.err{color:#ff8a8a;}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<header><div class="container brand">
  <span class="word">MGT Voting</span>
  <a href="index.html">&larr; Back to MGT site</a>
</div></header>

<div class="container">
  <div class="hero">
    <h1>Vote for your Starface</h1>
    <p>Support your favorite Starface — every vote counts toward the next MGT Talent Camp.</p>
  </div>
  <div id="statusBanner" class="status-banner status-closed">Checking voting status…</div>
  <div id="grid" class="grid"></div>
</div>

<footer>#MGT &middot; #BeyondExcellence</footer>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalName">Starface</h3>
    <div class="sub">Choose a vote package</div>
    <div class="pkgs" id="pkgs"></div>
    <input type="email" id="emailInput" placeholder="Your email (for payment receipt)">
    <button class="btn btn-primary" id="payBtn" disabled>Select a package</button>
    <button class="btn-close" id="closeModal">Cancel</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://khbfhdzanoypjgtywfrs.supabase.co";
const SUPABASE_KEY = "sb_publishable_ANw30HATqGIAIVm6EiyJ9Q_2JooHeM_";
const PAYSTACK_PUBLIC_KEY = "pk_live_0d4f146e0f423742f7e38aeae39ff1ba89e9d60b";

const PACKAGES = [
  {votes:7,   amount:500},
  {votes:15,  amount:1000},
  {votes:35,  amount:2000},
  {votes:100, amount:5000},
];

let starfaces = [];
let votingOpen = false;
let selected = null;
let selectedPkg = null;

async function sb(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return res.json();
}

async function loadAll(){
  const [sfs, settings] = await Promise.all([
    sb("starfaces?select=*&order=display_order.asc"),
    sb("voting_settings?select=voting_open"),
  ]);
  starfaces = Array.isArray(sfs) ? sfs : [];
  votingOpen = Array.isArray(settings) && settings[0] ? settings[0].voting_open : false;
  render();
}

function render(){
  const banner = document.getElementById("statusBanner");
  if (votingOpen){
    banner.className = "status-banner status-open";
    banner.textContent = "Voting is OPEN — tap a Starface to vote";
  } else {
    banner.className = "status-banner status-closed";
    banner.textContent = "Voting is currently closed. Check back soon!";
  }

  const grid = document.getElementById("grid");
  if (!starfaces.length){
    grid.innerHTML = '<div class="empty">Starfaces will appear here once this year\'s edition opens.</div>';
    return;
  }
  grid.innerHTML = starfaces.map(sf => `
    <div class="sf ${sf.eliminated ? 'eliminated':''}" onclick="${sf.eliminated || !votingOpen ? '' : `openModal('${sf.id}')`}">
      <div class="photo-wrap">
        <img class="photo-circle" src="${sf.photo_url || ''}" alt="${sf.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%231b1b1e%22/></svg>'">
        ${sf.eliminated ? '<div class="elim-tag"><span>ELIMINATED</span></div>' : ''}
        <div class="star-badge"><span>${sf.votes}</span></div>
      </div>
      <div class="sf-name">${sf.name}</div>
      <div class="sf-sub">${sf.eliminated ? 'Eliminated' : (votingOpen ? 'Tap to vote' : 'Votes so far')}</div>
    </div>
  `).join("");
}

window.openModal = function(id){
  selected = starfaces.find(s => s.id === id);
  selectedPkg = null;
  document.getElementById("modalName").textContent = selected.name;
  document.getElementById("pkgs").innerHTML = PACKAGES.map((p,i) => `
    <div class="pkg" id="pkg${i}" onclick="selectPkg(${i})">
      <div class="v">${p.votes} votes</div>
      <div class="p">&#8358;${p.amount.toLocaleString()}</div>
    </div>`).join("");
  document.getElementById("payBtn").disabled = true;
  document.getElementById("payBtn").textContent = "Select a package";
  document.getElementById("msg").textContent = "";
  document.getElementById("modalBg").classList.add("show");
};

window.selectPkg = function(i){
  selectedPkg = PACKAGES[i];
  document.querySelectorAll(".pkg").forEach(el => el.classList.remove("active"));
  document.getElementById(`pkg${i}`).classList.add("active");
  document.getElementById("payBtn").disabled = false;
  document.getElementById("payBtn").textContent = `Pay \u20A6${selectedPkg.amount.toLocaleString()}`;
};

document.getElementById("closeModal").onclick = () => document.getElementById("modalBg").classList.remove("show");

document.getElementById("payBtn").onclick = function(){
  const email = document.getElementById("emailInput").value.trim();
  const msg = document.getElementById("msg");
  if (!email || !email.includes("@")){
    msg.className = "msg err"; msg.textContent = "Please enter a valid email."; return;
  }
  if (!selectedPkg || !selected){ return; }
  msg.className = "msg"; msg.textContent = "";

  const reference = "MGT-" + Date.now() + "-" + Math.floor(Math.random()*100000);
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: email,
    amount: selectedPkg.amount * 100,
    currency: "NGN",
    ref: reference,
    metadata: { starface_id: selected.id, votes_purchased: selectedPkg.votes },
    callback: function(response){
      msg.className = "msg ok";
      msg.textContent = "Payment received! Your votes will reflect within a minute or two.";
      setTimeout(() => { document.getElementById("modalBg").classList.remove("show"); loadAll(); }, 2500);
    },
    onClose: function(){
      msg.className = "msg"; msg.textContent = "Payment window closed.";
    }
  });
  handler.openIframe();
};

loadAll();
setInterval(loadAll, 20000);
</script>
</body>
</html>
