<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGT Admin — Starfaces</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0b0b0c; --panel:#141416; --panel2:#1b1b1e;
  --red:#8c0f0f; --red-bright:#c41414; --gold:#d4af37; --gold-soft:#b8933f;
  --white:#f5f3ef; --muted:#a39d97; --line:#2a2626;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Poppins',Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Oswald',sans-serif;font-weight:600;}
.container{max-width:760px;margin:0 auto;padding:0 20px 60px;}
header{padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:30px;}
.word{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;}
.gate{max-width:360px;margin:100px auto;text-align:center;}
.gate input{width:100%;padding:14px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--white);font-size:15px;margin:16px 0;text-align:center;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:22px;}
.card h2{font-size:18px;margin-bottom:14px;color:var(--gold);}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;}
.toggle .dot{width:44px;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s;}
.toggle .dot::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:.2s;}
.toggle.on .dot{background:var(--gold);border-color:var(--gold);}
.toggle.on .dot::after{background:var(--black);left:23px;}
input[type=text], input[type=number]{width:100%;padding:11px 13px;border-radius:4px;border:1px solid var(--line);background:var(--black);color:var(--white);font-size:14px;margin-bottom:10px;}
input[type=file]{color:var(--muted);font-size:13px;margin-bottom:10px;}
.btn{padding:11px 18px;border-radius:4px;font-weight:600;font-size:13.5px;border:0;cursor:pointer;background:var(--red-bright);color:#fff;}
.btn.secondary{background:var(--panel2);color:var(--white);border:1px solid var(--line);}
.btn.small{padding:7px 12px;font-size:12px;}
.sf-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
.sf-item img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--panel2);}
.sf-item .info{flex:1;}
.sf-item .name{font-weight:600;font-size:14.5px;}
.sf-item .meta{font-size:12px;color:var(--muted);}
.sf-item .actions{display:flex;gap:8px;}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;margin-left:8px;}
.tag.active{background:rgba(212,175,55,.15);color:var(--gold);}
.tag.elim{background:rgba(196,20,20,.2);color:#ff8a8a;}
.msg{font-size:13.5px;margin-top:10px;min-height:16px;}
.msg.ok{color:#7fd97f;}
.msg.err{color:#ff8a8a;}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>MGT Admin</h1>
  <p style="color:var(--muted);margin-top:10px;">Enter your passcode to continue.</p>
  <input type="password" id="passInput" placeholder="Passcode">
  <button class="btn" onclick="unlock()" style="width:100%;">Unlock</button>
  <div class="msg err" id="gateMsg"></div>
</div>

<div id="panel" style="display:none;">
  <header><div class="container"><span class="word">MGT Admin — Starfaces</span></div></header>
  <div class="container">

    <div class="card">
      <h2>Voting status</h2>
      <div class="row">
        <span id="votingLabel">Loading…</span>
        <div class="toggle" id="votingToggle" onclick="toggleVoting()"><div class="dot"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>Add a Starface</h2>
      <input type="text" id="newName" placeholder="Starface name">
      <input type="file" id="newPhoto" accept="image/*">
      <input type="number" id="newOrder" placeholder="Display order (e.g. 1, 2, 3…)">
      <button class="btn" onclick="addStarface()">Add Starface</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <h2>Current Starfaces</h2>
      <div id="list">Loading…</div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://khbfhdzanoypjgtywfrs.supabase.co";
const SUPABASE_KEY = "sb_publishable_ANw30HATqGIAIVm6EiyJ9Q_2JooHeM_";
const ADMIN_FN = "https://khbfhdzanoypjgtywfrs.supabase.co/functions/v1/bright-endpoint";

let passcode = "";
let starfaces = [];
let votingOpen = false;

function unlock(){
  passcode = document.getElementById("passInput").value;
  if (!passcode){ return; }
  document.getElementById("gate").style.display = "none";
  document.getElementById("panel").style.display = "block";
  loadAll();
}

async function sb(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return res.json();
}

async function callAdmin(action, payload){
  const res = await fetch(ADMIN_FN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ passcode, action, payload }),
  });
  const data = await res.json();
  if (!res.ok || data.error){
    if (res.status === 401){
      document.getElementById("gateMsg").textContent = "Wrong passcode.";
      document.getElementById("gate").style.display = "block";
      document.getElementById("panel").style.display = "none";
    }
    throw new Error(data.error || "Request failed");
  }
  return data;
}

async function loadAll(){
  const [sfs, settings] = await Promise.all([
    sb("starfaces?select=*&order=display_order.asc"),
    sb("voting_settings?select=voting_open"),
  ]);
  starfaces = Array.isArray(sfs) ? sfs : [];
  votingOpen = Array.isArray(settings) && settings[0] ? settings[0].voting_open : false;
  renderVoting();
  renderList();
}

function renderVoting(){
  document.getElementById("votingLabel").textContent = votingOpen ? "Voting is OPEN" : "Voting is CLOSED";
  document.getElementById("votingToggle").className = "toggle" + (votingOpen ? " on" : "");
}

async function toggleVoting(){
  const next = !votingOpen;
  await callAdmin("set_voting_open", { open: next });
  votingOpen = next;
  renderVoting();
}

function renderList(){
  const list = document.getElementById("list");
  if (!starfaces.length){ list.innerHTML = '<p style="color:var(--muted);">No Starfaces added yet.</p>'; return; }
  list.innerHTML = starfaces.map(sf => `
    <div class="sf-item">
      <img src="${sf.photo_url || ''}" alt="">
      <div class="info">
        <div class="name">${sf.name} ${sf.eliminated ? '<span class="tag elim">Eliminated</span>' : '<span class="tag active">Active</span>'}</div>
        <div class="meta">${sf.votes} votes &middot; order ${sf.display_order ?? '-'}</div>
      </div>
      <div class="actions">
        <button class="btn small secondary" onclick="toggleEliminated('${sf.id}', ${!sf.eliminated})">${sf.eliminated ? 'Restore' : 'Eliminate'}</button>
        <button class="btn small" onclick="removeStarface('${sf.id}', '${sf.name.replace(/'/g,"\\'")}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function toggleEliminated(id, eliminated){
  await callAdmin("set_eliminated", { id, eliminated });
  loadAll();
}

async function removeStarface(id, name){
  if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
  await callAdmin("delete_starface", { id });
  loadAll();
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addStarface(){
  const name = document.getElementById("newName").value.trim();
  const order = parseInt(document.getElementById("newOrder").value, 10) || 0;
  const fileInput = document.getElementById("newPhoto");
  const msg = document.getElementById("addMsg");
  if (!name){ msg.className="msg err"; msg.textContent = "Name is required."; return; }

  msg.className = "msg"; msg.textContent = "Saving…";
  try {
    let photo_url = null;
    if (fileInput.files[0]){
      const base64 = await fileToBase64(fileInput.files[0]);
      const up = await callAdmin("upload_photo", { base64, contentType: fileInput.files[0].type });
      photo_url = up.url;
    }
    await callAdmin("add_starface", { name, photo_url, display_order: order });
    msg.className = "msg ok"; msg.textContent = "Starface added.";
    document.getElementById("newName").value = "";
    document.getElementById("newOrder").value = "";
    fileInput.value = "";
    loadAll();
  } catch (e){
    msg.className = "msg err"; msg.textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
